[package]
name = "rust-breaking"
version = "0.1.0"
edition = "2024"

[dependencies]
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["client", "http2"] }
hyper-tls = { version = "0.6.0", features = ["alpn"] }
hyper-util = { version = "0.1.15", features = ["http2", "client"] }
jsonwebtoken = "9.3.1"
serde = "1.0.219"
serde_json = "1.0.141"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "uuid",
    "chrono",
    "runtime-tokio",
] }
tokio = { version = "1.46.1", features = ["full"] }
tokio-stream = "0.1.17"
uuid = { version = "1.17.0", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4.4"

[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

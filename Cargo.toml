[package]
name = "rust-breaking"
version = "0.1.2"
edition = "2024"

[dependencies]
actix-web = { version = "4.11.0", default-features = false, features = [
    "macros",
] }
env_logger = "0.11.8"
futures-util = "0.3.31"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["client", "http2"] }
hyper-tls = { version = "0.6.0", features = ["alpn"] }
hyper-util = { version = "0.1.16", features = ["http2", "client"] }
jsonwebtoken = "9.3.1"
log = "0.4.27"
serde = "1.0.219"
serde_json = "1.0.142"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "uuid",
    "chrono",
    "runtime-tokio",
] }
tokio = { version = "1.47.1", features = ["full"] }
uuid = { version = "1.17.0", features = ["v4"] }

[[bin]]
name = "serverAPNS"
path = "src/main.rs"

#[[bin]]
#name = "cli"
#path = "src/cli.rs"

[profile.release]
opt-level = 3       # Maximum optimization for performance
lto = "fat"         # Enable full Link-Time Optimization
codegen-units = 1   # Minimize binary size with single codegen unit
strip = true        # Strip only debug symbols
panic = "unwind"    # Use unwinding for panic handling
incremental = false

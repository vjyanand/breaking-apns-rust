[package]
name = "rust-breaking"
version = "0.1.6"
edition = "2024"

[dependencies]
hyper = { version = "1.8.1", features = ["client", "http2"] }
env_logger = "0.11.8"
hyper-rustls = { version = "0.27.7", features = ["http2"] }
futures-util = "0.3.31"
http-body-util = "0.1.3"
hyper-util = { version = "0.1.19", features = ["http2", "client"] }
jsonwebtoken = { version = "10.2.0", default-features = false, features = [
  "aws_lc_rs",
  "use_pem",
] }
log = "0.4.29"
serde = "1.0.228"
serde_json = "1.0.148"
sqlx = { version = "0.8.6", features = [
  "postgres",
  "uuid",
  "chrono",
  "runtime-tokio",
] }
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.19.0", features = ["v4"] }
warp = { version = "0.4.2", features = ["server"] }

[[bin]]
name = "serverAPNS"
path = "src/main.rs"

[profile.release]
opt-level = 3     # Maximum optimization for performance
lto = "fat"       # Enable full Link-Time Optimization
codegen-units = 1 # Minimize binary size with single codegen unit
strip = true      # Strip only debug symbols
panic = "abort"   # Use unwinding for panic handling
#incremental = false
#debug = true

# fly.toml app configuration file generated for breaking-apns-rust-new on 2025-11-02T19:25:01+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'breaking-apns-rust-new'
primary_region = 'sjc'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 8080
    handlers = ['http']

    [services.ports.http_options]
      idle_timeout = 30

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 4

[checks]
  [checks.stats]
    grace_period = "30s"
    interval = "30m"
    method = "get"
    path = "/stats"
    port = 8080
    timeout = "10s"
    type = "http"

name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    container: alpine:latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        apk add --no-cache cargo rust
    - name: Build
      run: cargo build --verbose --release
    - name: Run tests
      run: cargo test --verbose

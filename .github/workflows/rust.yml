name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm rust cargo openssl pkgconf
    - name: Build
      run: cargo build --release
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-binary
        path: target/release/rust-breaking  # Replace with your actual binary name